[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-churras"
version = "0.0.1"
description = "Aplicativo que ajuda quem nunca fez churrasco a planejar o seu, com a ajuda da IA do Groq."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet]
product = "Churrasco Fácil"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "tests/telas"]
testpaths = ["tests"]
